services:
  catan:
    build: .
    container_name: catan-enhanced
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - catan-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  catan-data:

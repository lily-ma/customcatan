services:
  catan:
    image: ${CATAN_IMAGE:-ghcr.io/lily-ma/customcatan:latest}
    container_name: catan-enhanced
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - catan-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  catan-data:

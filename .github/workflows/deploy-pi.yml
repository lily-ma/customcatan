name: Deploy to Raspberry Pi

on:
  workflow_run:
    workflows: [Publish container]
    branches: [master, main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: raspberry-pi-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, ARM64, catan-pi]
    environment: raspberry-pi
    steps:
      - name: Check out the published revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy and wait for health check
        env:
          CATAN_IMAGE: ghcr.io/${{ github.repository }}:latest
        run: docker compose -f compose.pi.yaml up -d --pull always --remove-orphans --wait --wait-timeout 90

      - name: Verify host health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8081/api/health

      - name: Show deployed service
        if: always()
        run: docker compose -f compose.pi.yaml ps

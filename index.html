<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#092f3a" />
    <title>Catan Enhanced — Board</title>
  </head>
  <body class="board-page">
    <main id="app">
      <section id="game-shell" class="game-shell game-shell--board">
        <div id="board-viewport" class="board-viewport" aria-label="Interactive Catan board">
          <div class="board-connection" aria-live="polite">
            <span id="connection-dot" class="connection-dot"></span>
            <span id="connection-label">Connecting</span>
          </div>
          <section class="scoreboard" aria-labelledby="scoreboard-title">
            <div class="scoreboard__heading">
              <div><p class="eyebrow">Live game</p><h2 id="scoreboard-title">Voyagers</h2></div>
              <span class="scoreboard__hint">Controlled by phone</span>
            </div>
            <div id="scoreboard-players" class="scoreboard__players"></div>
          </section>
        </div>
      </section>
    </main>

    <!-- The board engine reuses these hidden status targets. Visible controls live at /controls. -->
    <div id="board-control-bridge" hidden>
      <span id="active-player-dot"></span><strong id="active-player-name"></strong>
      <p id="build-status"></p><p id="roll-status"></p><span id="board-seed"></span>
      <button id="edit-players" type="button"></button><button id="cancel-build" type="button"></button>
      <button id="clear-roll" type="button"></button><button id="new-board" type="button"></button>
      <button id="reset-view" type="button"></button><button id="sidebar-toggle" type="button"></button>
      <button data-build="town" type="button"></button><button data-build="city" type="button"></button><button data-build="road" type="button"></button>
      <button data-roll="2" type="button"></button><button data-roll="3" type="button"></button>
      <button data-roll="4" type="button"></button><button data-roll="5" type="button"></button>
      <button data-roll="6" type="button"></button><button data-roll="7" type="button"></button>
      <button data-roll="8" type="button"></button><button data-roll="9" type="button"></button>
      <button data-roll="10" type="button"></button><button data-roll="11" type="button"></button><button data-roll="12" type="button"></button>
      <dialog id="setup-dialog"><form id="setup-form"><div id="player-fields"></div><button id="add-player" type="button"></button><button id="cancel-setup" type="button"></button></form></dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
